{% extends "base.html"%}

{% block header %}
<h3> Password Reset Confirmation </h3>
{% endblock %}

{% block body %}
    {% if validlink %}
    <form method = "POST">
        {% csrf_token %}
        {{ form.as_p}}
        <input type ='submit' value = 'Change Password'>
    </form>
    {% else %}
    <p> Invalid password, reset link. </p>    
    {% endif %}

{% endblock %}
