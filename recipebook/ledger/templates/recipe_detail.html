{% extends 'base.html' %}

{% block body %}

<h2>{{ recipe.name }}</h2>
<p> Author:{{ recipe.author.name }}  </p> 
<ul>
    {% for ingredient in recipe.ingredients.all %}
        <li>{{ ingredient.ingredient.name }}: {{ ingredient.quantity }}</li>
    {% endfor %}
</ul>

<a href="/recipes/list">Back to the Recipe List</a>
{% endblock %}
